name: Sync Dropbox galleries

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_dropbox.py'
      - '.github/workflows/sync-dropbox.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: remember-rob-dropbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Sync Dropbox uploads
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: python scripts/sync_dropbox.py
      - name: Commit gallery changes safely
        run: |
          git config user.name "Remembering Rob Sync"
          git config user.email "actions@users.noreply.github.com"
          git add uploads uploads.json
          if git diff --cached --quiet; then
            echo "No gallery changes"
          else
            git commit -m "Sync Dropbox gallery uploads"
            git pull --rebase origin main
            git push origin main
          fi
