name: Audit original memorial media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-original-media.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone full old repository history
        run: |
          rm -rf audit/_repo audit/original-media
          mkdir -p audit/original-media
          git clone --quiet --mirror https://github.com/Tinki911/gkonopkaart.git audit/_repo.git

      - name: Extract every historical memorial image/video and build inventory
        shell: python
        run: |
          import base64, csv, hashlib, json, pathlib, re, subprocess

          repo=pathlib.Path('audit/_repo.git')
          out=pathlib.Path('audit/original-media')
          out.mkdir(parents=True,exist_ok=True)

          def git(*args, text=True):
              return subprocess.check_output(['git',f'--git-dir={repo}',*args],text=text,stderr=subprocess.DEVNULL)

          commits=[x for x in git('rev-list','--all').splitlines() if x]
          records=[]
          seen_binary={}
          seen_url={}
          source_versions={}

          # Parse complete quoted data URIs rather than assuming base64 is on one physical line.
          quoted_data=re.compile(r"(['\"])(data:(image|video)/([^;,'\"\s]+);base64,(.*?))\1",re.S)
          yt_form=re.compile(r"yt:(https?://[^'\"\s|]+)(?:\|([^'\"\s]+))?")
          youtube=re.compile(r"https?://(?:www\.)?(?:youtube\.com|youtu\.be)/[^'\"\s<]+")
          loc_assign=re.compile(r"ROB_MEDIA\s*\[\s*['\"]([^'\"]+)['\"]\s*\]")

          def location_for(path,text,pos=0):
              name=path.lower()
              for key,loc in [('slater','slaters'),('colorado','colorado'),('emerald','emerald'),('giant','giants'),('idwal','idwal'),('glenariffe','glenariffe')]:
                  if key in name: return loc
              # For inline page data, use the nearest preceding ROB_MEDIA assignment if present.
              prior=list(loc_assign.finditer(text[:pos]))
              return prior[-1].group(1) if prior else 'map-page'

          def ext_for(kind,sub):
              s=sub.lower()
              if kind=='image': return {'jpeg':'jpg','jpg':'jpg','png':'png','webp':'webp','gif':'gif','heic':'heic'}.get(s,s.replace('svg+xml','svg'))
              return {'mp4':'mp4','quicktime':'mov','webm':'webm','x-m4v':'m4v'}.get(s,s)

          for ci,commit in enumerate(commits):
              try:
                  tree=git('ls-tree','-r','--name-only',commit)
              except Exception:
                  continue
              paths=[p for p in tree.splitlines() if p.startswith('rob-map/') and (p.endswith('.js') or p.endswith('.html'))]
              for path in paths:
                  try:
                      blob=git('show',f'{commit}:{path}',text=False)
                      text=blob.decode('utf-8','replace')
                  except Exception:
                      continue
                  version_key=(path,hashlib.sha256(blob).hexdigest())
                  if version_key in source_versions: continue
                  source_versions[version_key]=commit

                  for m in quoted_data.finditer(text):
                      _,whole,kind,sub,payload=m.groups()
                      b64=''.join(ch for ch in payload if ch.isalnum() or ch in '+/=')
                      try: data=base64.b64decode(b64,validate=False)
                      except Exception: continue
                      if not data: continue
                      sha=hashlib.sha256(data).hexdigest()
                      loc=location_for(path,text,m.start())
                      unique=sha not in seen_binary
                      if unique:
                          folder=out/loc; folder.mkdir(parents=True,exist_ok=True)
                          n=sum(1 for x in seen_binary.values() if x['location']==loc and x['kind']==kind)+1
                          dest=folder/f'{loc}-{kind}-{n:03d}.{ext_for(kind,sub)}'
                          dest.write_bytes(data)
                          seen_binary[sha]={'path':str(dest),'location':loc,'kind':kind}
                      rec={'location':loc,'kind':kind,'format':sub,'bytes':len(data),'sha256':sha,
                           'source_path':path,'source_commit':commit,'source_blob_sha256':version_key[1],
                           'extracted_path':seen_binary[sha]['path'],'is_duplicate':not unique,
                           'duplicate_of':'' if unique else seen_binary[sha]['path']}
                      records.append(rec)

                  # Capture yt: links and regular YouTube links in historical page/script versions.
                  captured=set()
                  for m in yt_form.finditer(text):
                      url,thumb=m.groups(); captured.add(url)
                      loc=location_for(path,text,m.start())
                      key=url
                      unique=key not in seen_url
                      if unique: seen_url[key]={'location':loc,'first_source':path,'commit':commit}
                      records.append({'location':loc,'kind':'youtube','format':'url','bytes':0,
                                      'sha256':hashlib.sha256(url.encode()).hexdigest(),'source_path':path,
                                      'source_commit':commit,'source_blob_sha256':version_key[1],'extracted_path':'',
                                      'is_duplicate':not unique,'duplicate_of':'' if unique else seen_url[key]['first_source'],
                                      'url':url,'thumbnail':thumb or ''})
                  for m in youtube.finditer(text):
                      url=m.group(0).rstrip(');,]');
                      if url in captured: continue
                      loc=location_for(path,text,m.start())
                      unique=url not in seen_url
                      if unique: seen_url[url]={'location':loc,'first_source':path,'commit':commit}
                      records.append({'location':loc,'kind':'youtube','format':'url','bytes':0,
                                      'sha256':hashlib.sha256(url.encode()).hexdigest(),'source_path':path,
                                      'source_commit':commit,'source_blob_sha256':version_key[1],'extracted_path':'',
                                      'is_duplicate':not unique,'duplicate_of':'' if unique else seen_url[url]['first_source'],
                                      'url':url,'thumbnail':''})

          locs={}
          for sha,x in seen_binary.items():
              s=locs.setdefault(x['location'],{'unique_photos':0,'unique_embedded_videos':0,'unique_youtube_links':0,'binary_bytes':0})
              if x['kind']=='image': s['unique_photos']+=1
              else: s['unique_embedded_videos']+=1
              # bytes from first corresponding record
              r=next(r for r in records if r['sha256']==sha and r['kind']==x['kind'])
              s['binary_bytes']+=r['bytes']
          for url,x in seen_url.items():
              s=locs.setdefault(x['location'],{'unique_photos':0,'unique_embedded_videos':0,'unique_youtube_links':0,'binary_bytes':0})
              s['unique_youtube_links']+=1

          manifest={'scope':'entire Git history of Tinki911/gkonopkaart rob-map',
                    'commits_scanned':len(commits),'unique_source_versions_scanned':len(source_versions),
                    'location_summary':locs,'unique_binary_files':len(seen_binary),'unique_youtube_links':len(seen_url),
                    'records':records}
          pathlib.Path('audit/original-media-inventory.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          fields=['location','kind','format','bytes','sha256','source_path','source_commit','source_blob_sha256','extracted_path','is_duplicate','duplicate_of','url','thumbnail']
          with open('audit/original-media-inventory.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader()
              for r in records: w.writerow({k:r.get(k,'') for k in fields})

          lines=['# Original memorial media audit','',
                 'Scope: **entire Git history** of `Tinki911/gkonopkaart`, restricted to `rob-map/` JavaScript and HTML files.','',
                 'This audit is independent of the live Remembering Rob page and does **not** include new Dropbox uploads.','',
                 '| Location | Unique photos | Unique embedded videos | Unique YouTube links |',
                 '|---|---:|---:|---:|']
          for loc in sorted(locs):
              s=locs[loc]; lines.append(f"| {loc} | {s['unique_photos']} | {s['unique_embedded_videos']} | {s['unique_youtube_links']} |")
          lines += ['',f"Commits scanned: **{len(commits)}**",f"Unique historical source-file versions scanned: **{len(source_versions)}**",
                    f"Unique extracted image/video binaries: **{len(seen_binary)}**",f"Unique YouTube links found: **{len(seen_url)}**",'',
                    'Every unique embedded image/video has been decoded into `audit/original-media/<location>/`.',
                    'Every occurrence, duplicate, source path, source commit and SHA-256 hash is recorded in the CSV/JSON inventory.']
          pathlib.Path('audit/README.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')

      - name: Remove temporary mirror
        run: rm -rf audit/_repo.git

      - name: Commit audit only
        run: |
          git config user.name 'Remembering Rob Media Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add audit
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Audit full history and extract original memorial media'
            git push
          fi
