name: Audit original memorial media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-original-media.yml'
      - 'scripts/audit_history_node.js'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone full old repository history
        run: |
          rm -rf audit/_repo.git audit/original-media
          mkdir -p audit/original-media
          git clone --quiet --mirror https://github.com/Tinki911/gkonopkaart.git audit/_repo.git

      - name: Execute historical media scripts in sandbox and build inventory
        run: node scripts/audit_history_node.js audit/_repo.git

      - name: Remove temporary mirror
        run: rm -rf audit/_repo.git

      - name: Commit audit only
        run: |
          git config user.name 'Remembering Rob Media Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add audit
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Rebuild complete original memorial media inventory with sandbox extractor'
            git push
          fi
