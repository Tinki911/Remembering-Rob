<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Remembering Rob</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f2eb;--card:#fffdf9;--ink:#25211d;--muted:#6f665e;--wine:#8f2f3a}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}body{display:grid;grid-template-rows:auto 1fr}header{padding:14px 16px 10px;border-bottom:1px solid #ddd3c7}h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:500}.sub{margin:4px 0 0;color:var(--muted);font:14px system-ui,sans-serif}#map{min-height:520px}.heart{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--wine);color:#fff;border:2px solid #fff;box-shadow:0 3px 12px #0004;font-size:20px}.leaflet-popup-content{min-width:245px;font:13px system-ui,sans-serif}.place{font:22px Georgia,serif;margin:0 0 4px}.where{color:var(--muted);margin-bottom:8px}.status{display:inline-block;background:#f2dde0;color:#722631;border-radius:999px;padding:5px 8px;margin:0 0 8px;font-weight:700;font-size:12px}.note{line-height:1.4;margin-bottom:10px}.actions{display:flex;flex-wrap:wrap;gap:7px}.btn{border:0;border-radius:10px;padding:9px 11px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:12px;cursor:pointer;display:inline-block}.btn.alt{background:#eee7df;color:var(--ink)}.btn.heartbtn{background:var(--wine)}.modal{display:none;position:fixed;inset:0;z-index:2000;background:#151210d9;padding:10px;align-items:center;justify-content:center}.modal.open{display:flex}.panel{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:18px}.head{position:sticky;top:0;z-index:3;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #ddd3c7}.head h2{margin:0;font:22px Georgia,serif}.close{border:0;border-radius:50%;width:38px;height:38px;font-size:22px;cursor:pointer}.gallery{padding:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.thumb{display:block;position:relative;border:0;padding:0;background:#eee;border-radius:9px;overflow:hidden;aspect-ratio:1/1;cursor:pointer}.thumb img,.thumb video{display:block;width:100%;height:100%;object-fit:cover}.thumb.video:after,.ytplay:after{content:'▶';position:absolute;inset:0;display:grid;place-items:center;font:44px system-ui;color:white;text-shadow:0 2px 8px #000}.thumb.video:before{content:'';position:absolute;inset:0;background:#0002}.empty{grid-column:1/-1;padding:26px 16px 14px;text-align:center;color:var(--muted);font:14px system-ui,sans-serif}.viewer{display:none;position:fixed;inset:0;z-index:4000;background:#000;align-items:center;justify-content:center}.viewer.open{display:flex}.viewer img,.viewer video{max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}.viewerClose{position:fixed;z-index:4010;top:max(14px,env(safe-area-inset-top));right:14px;width:46px;height:46px;border:0;border-radius:50%;font-size:28px;background:#fff;color:#111}.syncnote{padding:10px 14px;border-top:1px solid #eee3d8;color:var(--muted);font:12px system-ui,sans-serif;text-align:center}@media(max-width:700px){#map{min-height:460px}.panel{width:100%;max-height:84vh}.head h2{font-size:19px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:7px}}
</style>
</head>
<body>
<header><h1>Remembering Rob</h1><p class="sub">Places where friends can visit, remember him, and share memories. ♥ 6 scattering places</p></header>
<div id="map"></div>
<div id="galleryModal" class="modal"><div class="panel"><div class="head"><h2 id="galleryTitle">Photos & videos</h2><button class="close" onclick="closeModal('galleryModal')">×</button></div><div id="gallery" class="gallery"></div><div class="syncnote">New uploads are added to the gallery automatically after Dropbox sync.</div></div></div>
<div id="viewer" class="viewer"><button class="viewerClose" onclick="closeViewer()">×</button><div id="viewerMedia"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.ROB_MEDIA={};</script>
<script src="media-slaters.js?v=local2"></script>
<script src="media-colorado.js?v=local2"></script>
<script src="media-emerald.js?v=local2"></script>
<script src="media-giants.js?v=local2"></script>
<script src="media-idwal.js?v=local2"></script>
<script src="media-glenariffe.js?v=local2"></script>
<script>
const uploadLinks={slaters:'https://www.dropbox.com/request/st6mus62o5qmwn78a4rd',colorado:'https://www.dropbox.com/request/i1n4zux1ih989umjxanq',emerald:'https://www.dropbox.com/request/wo1t57bmxavzeyzopqat',giants:'https://www.dropbox.com/request/z8k0kievfboxc9sh9vit',idwal:'https://www.dropbox.com/request/rsd8z2l7yur6lti60foq',glenariffe:'https://www.dropbox.com/request/quh176hvn1ymk01fghho'};
const places=[{id:'slaters',name:'Slater’s Bridge',area:'Little Langdale · Lake District · England',lat:54.4178,lng:-3.06159,note:'Rob’s first place — at the old slate packhorse bridge over the River Brathay.'},{id:'colorado',name:'Colorado River',area:'Black Canyon · about 12 miles below Hoover Dam · USA',lat:35.8825,lng:-114.7,note:'Approximate pin for now.'},{id:'emerald',name:'Emerald Cave',area:'Black Canyon · Colorado River · Arizona',lat:35.8909,lng:-114.6856,note:'Ashes scattered at Emerald Cave on the Colorado River.'},{id:'giants',name:'Giant’s Causeway',area:'County Antrim · Northern Ireland',lat:55.2408,lng:-6.5115,exact:'https://maps.app.goo.gl/nYTTpR5TMHpGDwmE9?g_st=ac',note:'Directions open the exact scattering pin.'},{id:'idwal',name:'Upper Waterfall Bridge · Cwm Idwal',area:'Llyn Idwal · Eryri (Snowdonia) · Wales',lat:53.1169,lng:-4.0284,exact:'https://maps.app.goo.gl/MMzBFZcLBFkCvD1z6?g_st=ac',note:'Ashes scattered at the high waterfall bridge near the top of the trail.'},{id:'glenariffe',name:'Glenariffe Coast',area:'Glenariffe · County Antrim · Northern Ireland',lat:55.0534,lng:-6.0475,exact:'https://maps.app.goo.gl/wxq9B3BrQuj3M4mR7?g_st=ac',note:'Directions open the exact scattering pin.'}];
const byId=Object.fromEntries(places.map(p=>[p.id,p]));
let synced={slaters:[],colorado:[],emerald:[],giants:[],idwal:[],glenariffe:[]};
fetch('uploads.json?ts='+Date.now()).then(r=>r.ok?r.json():{}).then(j=>{synced={...synced,...j};refreshPopups();}).catch(()=>{});
function allMedia(id){return [...(window.ROB_MEDIA[id]||[]),...(synced[id]||[])];}
function isPosterVideo(s){return typeof s==='string'&&s.startsWith('vp:');}
function posterVideoParts(s){const [video,poster]=s.slice(3).split('|');return {video,poster};}
function isVideo(s){if(isPosterVideo(s))return true;return /\.(mp4|mov|m4v|webm)(\?|$)/i.test(s);}
function isYoutube(s){return typeof s==='string'&&s.startsWith('yt:');}
function ytParts(s){const raw=s.slice(3);const [url,thumb]=raw.split('|');return {url,thumb};}
function mediaSrc(s){return isPosterVideo(s)?posterVideoParts(s).video:s;}
const map=L.map('map',{worldCopyJump:true}).setView([43,-38],3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ico=()=>L.divIcon({className:'',html:'<div class="heart">♥</div>',iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18]});
const markers={};
function popupHtml(p){const dir=p.exact||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lat+','+p.lng);const n=allMedia(p.id).length;return '<h2 class="place">'+p.name+'</h2><div class="where">'+p.area+'</div><div class="status">♥ Ashes scattered here</div><div class="note">'+p.note+'</div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="'+dir+'">Get directions</a><button class="btn alt" onclick="openGallery(\''+p.id+'\')">'+(n?'View photos ('+n+')':'Photos')+'</button><a class="btn heartbtn" target="_blank" rel="noopener" href="'+uploadLinks[p.id]+'">＋ Upload photos</a></div>';}
places.forEach(p=>{markers[p.id]=L.marker([p.lat,p.lng],{icon:ico()}).addTo(map).bindPopup(popupHtml(p));});
function refreshPopups(){places.forEach(p=>markers[p.id].setPopupContent(popupHtml(p)));}
function openGallery(id){const p=byId[id],g=document.getElementById('gallery'),media=allMedia(id);document.getElementById('galleryTitle').textContent=p.name+' — photos & videos';g.innerHTML=media.length?media.map((s,i)=>{if(isYoutube(s)){const y=ytParts(s);return '<button class="thumb ytplay" onclick="window.open(\''+y.url+'\',\'_blank\')"><img src="'+y.thumb+'" alt="High quality YouTube video"></button>';}if(isPosterVideo(s)){const v=posterVideoParts(s);return '<button class="thumb video" onclick="openMedia(\''+id+'\','+i+')"><img src="'+v.poster+'" alt="Video thumbnail"></button>';}if(isVideo(s)){return '<button class="thumb video" onclick="openMedia(\''+id+'\','+i+')"><video muted playsinline preload="metadata" src="'+s+'#t=0.5"></video></button>';}return '<button class="thumb" onclick="openMedia(\''+id+'\','+i+')"><img loading="lazy" src="'+s+'" alt="'+p.name+' photo '+(i+1)+'"></button>';}).join(''):'<div class="empty">No photos or videos have been added here yet.</div>';document.getElementById('galleryModal').classList.add('open');}
function openMedia(id,i){const s=allMedia(id)[i];if(!s)return;if(isYoutube(s)){window.open(ytParts(s).url,'_blank');return;}const src=mediaSrc(s);const box=document.getElementById('viewerMedia');box.innerHTML=isVideo(s)?'<video controls autoplay playsinline src="'+src+'"></video>':'<img src="'+src+'" alt="Photo">';document.getElementById('viewer').classList.add('open');document.body.style.overflow='hidden';}
function closeViewer(){document.getElementById('viewerMedia').innerHTML='';document.getElementById('viewer').classList.remove('open');document.body.style.overflow='';}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});document.getElementById('viewer').onclick=e=>{if(e.target.id==='viewer'||e.target.id==='viewerMedia')closeViewer()};
</script>
</body></html>
